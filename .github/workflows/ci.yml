name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Perl ${{ matrix.perl }}${{ matrix.multi-thread && ' with threads' || '' }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        distribution: [default]
        perl: ['5.34', '5.36', '5.38', '5.40']
        multi-thread: [false, true]
        include:
          # macOS exercises the HAVE_REALLOCF branch of Makefile.PL. The
          # latest Perl both ways is enough there; the version spread
          # runs on Linux.
          - os: macos-latest
            distribution: default
            perl: latest
            multi-thread: false
          - os: macos-latest
            distribution: default
            perl: latest
            multi-thread: true
          # setup-perl's own Windows Perls 5.40+ are built against
          # msvcrt, the runner's gcc against UCRT, and XS modules that
          # mix both crash; Strawberry brings its Perl and gcc together
          # and is always threaded.
          - os: windows-latest
            distribution: strawberry
            perl: latest
            multi-thread: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution }}
          multi-thread: ${{ matrix.multi-thread }}

      - name: Show Perl configuration
        run: perl -V

      # The make this Perl was built with (gmake on Windows)
      - name: Find make
        shell: perl {0}
        run: |
          use Config;
          open my $env, '>>', $ENV{GITHUB_ENV} or die "GITHUB_ENV: $!";
          print {$env} "MAKE=$Config{make}\n";

      - name: Install configure dependencies
        # cpanm --installdeps runs Makefile.PL to learn the prerequisites,
        # and Makefile.PL needs Devel::PPPort to generate ppport.h.
        run: cpanm --notest Devel::PPPort

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: ${{ env.MAKE }}

      - name: Test
        env:
          HARNESS_OPTIONS: j4
        run: ${{ env.MAKE }} test

      - name: Test the distribution tarball
        # Builds the tarball from MANIFEST, unpacks, configures and tests
        # it, which catches files missing from MANIFEST. Once per
        # workflow is enough; the Linux jobs run it.
        if: runner.os == 'Linux'
        run: make disttest

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -lvb t

  freebsd:
    name: Perl from pkg on FreeBSD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test in a FreeBSD VM
        # GitHub has no BSD runners; this boots a FreeBSD VM on the Linux
        # runner and runs the scripts inside it. The packaged Perl is the
        # one FreeBSD users have, and it exercises the HAVE_REALLOCF
        # branch of Makefile.PL with clang.
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y perl5 p5-App-cpanminus
          run: |
            set -e
            perl -V
            cpanm --notest Devel::PPPort
            cpanm --installdeps --notest --verbose .
            perl Makefile.PL
            MAKE=$(perl -MConfig -e 'print $Config{make}')
            $MAKE
            HARNESS_OPTIONS=j4 $MAKE test

  wide-nv:
    name: Perl 5.40 with ${{ matrix.nv }} NVs on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nv: long double
            configure: -Duselongdouble
            name: longdouble
          - nv: quadmath
            configure: -Dusequadmath
            name: quadmath
    env:
      PERL_VERSION: 5.40.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-perl offers no long double or quadmath builds, so perl is
      # built from source and cached; a cache miss costs about ten minutes.
      - name: Restore the built perl
        id: perl-cache
        uses: actions/cache@v4
        with:
          path: ~/perl-${{ matrix.name }}
          key: perl-${{ env.PERL_VERSION }}-${{ matrix.name }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build perl ${{ env.PERL_VERSION }} ${{ matrix.configure }}
        if: steps.perl-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sfL -o perl.tar.gz "https://www.cpan.org/src/5.0/perl-$PERL_VERSION.tar.gz"
          tar xzf perl.tar.gz
          cd "perl-$PERL_VERSION"
          ./Configure -des -Dprefix="$HOME/perl-${{ matrix.name }}" ${{ matrix.configure }} >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null

      - name: Use the built perl
        run: echo "$HOME/perl-${{ matrix.name }}/bin" >> "$GITHUB_PATH"

      - name: Show the NV type
        run: perl -V:nvtype -V:nvsize -V:usequadmath -V:uselongdouble

      # Devel::PPPort and Test::More ship with perl; no CPAN client needed.
      - name: Configure, build and test
        env:
          HARNESS_OPTIONS: j4
        run: |
          perl Makefile.PL
          make
          make test

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -lvb t

  sanitizers:
    name: AddressSanitizer and UBSan (Perl 5.40 with threads)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl 5.40
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'
          multi-thread: true

      - name: Install configure dependencies
        run: cpanm --notest Devel::PPPort

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure with the sanitizers
        run: >
          perl Makefile.PL
          OPTIMIZE="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
          LDDLFLAGS="-shared -fsanitize=address,undefined"

      - name: Build
        run: make

      - name: Test under the sanitizers
        # perl itself is not built with ASan, so the runtime is preloaded.
        # Leak checking is off because perl frees little at exit;
        # halt_on_error makes any UBSan report fail the job.
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: LD_PRELOAD="$(gcc -print-file-name=libasan.so)" prove -b t
